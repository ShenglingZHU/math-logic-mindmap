[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "math-logic-mindmap"
version = "0.12.2"
description = "Auditable mathematical proof models, Obsidian Canvas and linked notes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "ZHU Shengling" }]
dependencies = ["jsonschema>=4.18,<5"]

[project.urls]
Homepage = "https://github.com/ShenglingZHU/math-logic-mindmap"
Repository = "https://github.com/ShenglingZHU/math-logic-mindmap"

[project.scripts]
math-logic-mindmap = "math_logic_mindmap.cli:main"

[tool.setuptools]
package-dir = {"" = "skills/math-logic-mindmap/scripts"}

[tool.setuptools.packages.find]
where = ["skills/math-logic-mindmap/scripts"]

[tool.setuptools.package-data]
math_logic_mindmap = ["schemas/*.json"]
